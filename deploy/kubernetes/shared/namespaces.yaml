apiVersion: v1
kind: Namespace
metadata:
  name: audio-external
  labels:
    zone: external
    app.kubernetes.io/part-of: secure-audio-upload
---
apiVersion: v1
kind: Namespace
metadata:
  name: audio-internal
  labels:
    zone: internal
    app.kubernetes.io/part-of: secure-audio-upload
---
# ── Network Policy: Zone Interne - Deny All Ingress by default ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: audio-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
# ── Network Policy: Allow internal-ingester to receive from dmz-to-internal-bridge ONLY ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-ingester-from-external
  namespace: audio-internal
spec:
  podSelector:
    matchLabels:
      app: internal-ingester
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: external
          podSelector:
            matchLabels:
              app: dmz-to-internal-bridge
      ports:
        - protocol: TCP
          port: 8090
---
# ── Network Policy: Allow device-token-authority to receive from mesreunions-web ONLY ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-device-token-authority-from-external
  namespace: audio-internal
spec:
  podSelector:
    matchLabels:
      app: device-token-authority
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: external
          podSelector:
            matchLabels:
              app: mesreunions-web
      ports:
        - protocol: TCP
          port: 8091
---
# ── Network Policy: Allow admin-console to reach internal Postgres (read-only dashboard needs) ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-console-to-internal-postgres
  namespace: audio-internal
spec:
  podSelector:
    matchLabels:
      app: postgres-internal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: external
          podSelector:
            matchLabels:
              app: admin-console
      ports:
        - protocol: TCP
          port: 5432
---
# ── Network Policy: Internal pods can talk to each other ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
  namespace: audio-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: internal
---
# ── Network Policy: Zone Externe - Allow inbound from Internet ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-ingress
  namespace: audio-external
spec:
  podSelector:
    matchLabels:
      tier: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
