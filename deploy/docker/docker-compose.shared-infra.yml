##############################################################################
# Overlay — partage infra avec owuicore-main (Keycloak + Postgres)
#
# Usage :
#   cd deploy/docker
#   docker compose \
#     -f docker-compose.yml -f docker-compose.shared-infra.yml \
#     up -d rabbitmq clamav \
#        minio-upload minio-processed minio-internal \
#        code-generator upload-portal admin-portal \
#        antivirus-worker transcode-worker file-mover \
#        token-issuer file-puller transcription-stub
#
# Prérequis (à exécuter par l'utilisateur, cf doc) :
#   1. Client `mes-reunions` présent dans le realm `openwebui` du
#      Keycloak owuicore-keycloak-1 (déjà ajouté à realm-openwebui.json
#      et realm-openwebui.k8s.json côté owuicore-main). Si owuicore tourne
#      déjà, restart Keycloak pour propager OU import du client via UI/kcadm.
#   2. Databases `audio_upload_ext` + `audio_upload_int` créées via
#      bootstrap-shared-db.sql dans owuicore-postgres-1
#   3. Migrations migrations/external/* et migrations/internal/* appliquées
##############################################################################

services:

  # Services InfraOWUI partagés — NE PAS démarrer
  postgres-external:
    profiles: ["never-start"]
  postgres-internal:
    profiles: ["never-start"]
  keycloak:
    profiles: ["never-start"]

  # ═══════════════════════════════════════════════════════════════════════
  # ZONE EXTERNE — re-câblage vers owuicore-postgres-1 + owuicore-keycloak-1
  # ═══════════════════════════════════════════════════════════════════════

  code-generator:
    environment:
      OIDC_ISSUER: http://${PUBLIC_HOST:-localhost}:8082/realms/openwebui
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/openwebui
      OIDC_CLIENT_ID: mes-reunions
      OIDC_CLIENT_SECRET: dev-client-secret
      OIDC_OFFLINE_ACCESS: "false"
      EXT_DB_HOST: postgres
      EXT_DB_PORT: "5432"
      EXT_DB_NAME: audio_upload_ext
      EXT_DB_USER: audio_ext
      EXT_DB_PASSWORD: audio_ext_dev
    depends_on: !reset
      token-issuer:
        condition: service_started
    networks:
      - external-net
      - dmz-net
      - internal-net
      - owui-net

  admin-portal:
    environment:
      OIDC_ISSUER: http://${PUBLIC_HOST:-localhost}:8082/realms/openwebui
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/openwebui
      OIDC_CLIENT_ID: mes-reunions
      OIDC_CLIENT_SECRET: dev-client-secret
      OIDC_OFFLINE_ACCESS: "false"
      OIDC_REDIRECT_URI: http://${PUBLIC_HOST:-localhost}:8222/auth/callback
      ADMIN_PORTAL_PORT: "8082"
      EXT_DB_HOST: postgres
      EXT_DB_PORT: "5432"
      EXT_DB_NAME: audio_upload_ext
      EXT_DB_USER: audio_ext
      EXT_DB_PASSWORD: audio_ext_dev
      INT_DB_HOST: postgres
      INT_DB_PORT: "5432"
      INT_DB_NAME: audio_upload_int
      INT_DB_USER: audio_int
      INT_DB_PASSWORD: audio_int_dev
    ports: !override
      - "8222:8082"  # remap host : conflit owuicore-keycloak-1 sur 8082
    depends_on: !reset []
    networks:
      - external-net
      - internal-net
      - owui-net

  upload-portal:
    environment:
      EXT_DB_HOST: postgres
      EXT_DB_PORT: "5432"
      EXT_DB_NAME: audio_upload_ext
      EXT_DB_USER: audio_ext
      EXT_DB_PASSWORD: audio_ext_dev
    depends_on: !reset []
    networks:
      - external-net
      - dmz-net
      - owui-net

  antivirus-worker:
    environment:
      EXT_DB_HOST: postgres
      EXT_DB_PORT: "5432"
      EXT_DB_NAME: audio_upload_ext
      EXT_DB_USER: audio_ext
      EXT_DB_PASSWORD: audio_ext_dev
    depends_on: !reset []
    networks:
      - external-net
      - owui-net

  transcode-worker:
    environment:
      EXT_DB_HOST: postgres
      EXT_DB_PORT: "5432"
      EXT_DB_NAME: audio_upload_ext
      EXT_DB_USER: audio_ext
      EXT_DB_PASSWORD: audio_ext_dev
    depends_on: !reset []
    networks:
      - external-net
      - owui-net

  file-mover:
    environment:
      EXT_DB_HOST: postgres
      EXT_DB_PORT: "5432"
      EXT_DB_NAME: audio_upload_ext
      EXT_DB_USER: audio_ext
      EXT_DB_PASSWORD: audio_ext_dev
    depends_on: !reset []
    networks:
      - external-net
      - dmz-net
      - owui-net

  # ═══════════════════════════════════════════════════════════════════════
  # ZONE INTERNE — re-câblage DB
  # ═══════════════════════════════════════════════════════════════════════

  token-issuer:
    environment:
      INT_DB_HOST: postgres
      INT_DB_PORT: "5432"
      INT_DB_NAME: audio_upload_int
      INT_DB_USER: audio_int
      INT_DB_PASSWORD: audio_int_dev
    depends_on: !reset []
    networks:
      - internal-net
      - dmz-net
      - owui-net

  file-puller:
    environment:
      INT_DB_HOST: postgres
      INT_DB_PORT: "5432"
      INT_DB_NAME: audio_upload_int
      INT_DB_USER: audio_int
      INT_DB_PASSWORD: audio_int_dev
    depends_on: !reset []
    networks:
      - internal-net
      - dmz-net
      - owui-net

  transcription-stub:
    environment:
      INT_DB_HOST: postgres
      INT_DB_PORT: "5432"
      INT_DB_NAME: audio_upload_int
      INT_DB_USER: audio_int
      INT_DB_PASSWORD: audio_int_dev
    depends_on: !reset []
    networks:
      - internal-net
      - owui-net

networks:
  owui-net:
    external: true
    name: owui-net
