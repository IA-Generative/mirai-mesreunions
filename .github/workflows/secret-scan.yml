name: secret-scan

# Garde anti-fuite : scanne tout l'historique sur chaque PR et push.
# Utilise le binaire gitleaks directement (gratuit) plutôt que l'action
# gitleaks-action, qui exige une licence payante pour les organisations.
# À marquer "required" dans Settings > Branches pour bloquer le merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : indispensable pour scanner les commits

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact -v
