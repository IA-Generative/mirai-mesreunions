name: secret-scan

# Garde anti-fuite : scanne l'historique sur chaque PR et push.
# À marquer "required" dans Settings > Branches pour bloquer le merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : indispensable pour scanner les commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
